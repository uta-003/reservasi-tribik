<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Balai Lelang Tribik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #5E0006; color: #EED9B9; }
    .glass-box { background: rgba(155, 15, 6, 0.3); backdrop-filter: blur(12px); border: 1px solid rgba(213, 62, 15, 0.3); }
  </style>
</head>
<body class="p-6 min-h-screen">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header Admin -->
    <div class="flex justify-between items-center glass-box p-5 rounded-2xl">
      <div>
        <h1 class="text-2xl font-bold text-[#EED9B9]">Panel Kontrol Loket Admin</h1>
        <p class="text-xs opacity-75">Balai Lelang Tribik</p>
      </div>
      <div class="flex items-center gap-3">
        <label class="text-xs font-bold uppercase">Pilih Loket Anda:</label>
        <select id="selectLoket" class="bg-[#5E0006] text-[#EED9B9] border border-[#D53E0F] px-4 py-2 rounded-xl text-sm font-bold">
          <option value="1">Loket 1</option>
          <option value="2">Loket 2</option>
          <option value="3">Loket 3</option>
        </select>
      </div>
    </div>

    <!-- Layout Grid Admin -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Daftar Antrian Menunggu -->
      <div class="glass-box p-5 rounded-2xl space-y-4">
        <h2 class="font-bold text-lg text-[#EED9B9] border-b border-[#D53E0F] pb-2">Daftar Antrian Menunggu</h2>
        <div id="daftarAntrian" class="space-y-3 max-h-[550px] overflow-y-auto pr-2">
          <p class="text-sm opacity-50">Memuat data antrian...</p>
        </div>
      </div>

      <!-- 3 Tampilan Sedang Diproses Berdasarkan Kategori -->
      <div class="space-y-6">
        
        <h2 class="font-bold text-lg text-[#EED9B9] border-b border-[#D53E0F] pb-2">Sedang Dilayani Saat Ini (3 Kategori)</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- 1. Unit -->
          <div class="glass-box p-4 rounded-2xl text-center flex flex-col justify-between space-y-3">
            <span class="text-[10px] font-bold uppercase tracking-wider bg-[#D53E0F] text-[#EED9B9] px-2 py-1 rounded-full">Unit</span>
            <div>
              <div id="aktifNomorUnit" class="text-3xl font-black text-[#EED9B9]">--</div>
              <div id="aktifNamaUnit" class="text-xs opacity-80 truncate mt-1">Tidak ada</div>
            </div>
            <div class="space-y-2">
              <button onclick="panggilUlangKategori('unit')" class="w-full py-1.5 bg-[#D53E0F] hover:bg-[#9B0F06] text-[#EED9B9] font-bold text-xs rounded-lg shadow">
                🔊 Panggil Suara
              </button>
              <button onclick="selesaikanAntrianKategori('unit')" class="w-full py-1.5 bg-green-700 hover:bg-green-800 text-white font-bold text-xs rounded-lg shadow">
                Selesai
              </button>
            </div>
          </div>

          <!-- 2. BPKB -->
          <div class="glass-box p-4 rounded-2xl text-center flex flex-col justify-between space-y-3">
            <span class="text-[10px] font-bold uppercase tracking-wider bg-[#D53E0F] text-[#EED9B9] px-2 py-1 rounded-full">BPKB</span>
            <div>
              <div id="aktifNomorBpkb" class="text-3xl font-black text-[#EED9B9]">--</div>
              <div id="aktifNamaBpkb" class="text-xs opacity-80 truncate mt-1">Tidak ada</div>
            </div>
            <div class="space-y-2">
              <button onclick="panggilUlangKategori('bpkb')" class="w-full py-1.5 bg-[#D53E0F] hover:bg-[#9B0F06] text-[#EED9B9] font-bold text-xs rounded-lg shadow">
                🔊 Panggil Suara
              </button>
              <button onclick="selesaikanAntrianKategori('bpkb')" class="w-full py-1.5 bg-green-700 hover:bg-green-800 text-white font-bold text-xs rounded-lg shadow">
                Selesai
              </button>
            </div>
          </div>

          <!-- 3. Pelunasan -->
          <div class="glass-box p-4 rounded-2xl text-center flex flex-col justify-between space-y-3">
            <span class="text-[10px] font-bold uppercase tracking-wider bg-[#D53E0F] text-[#EED9B9] px-2 py-1 rounded-full">Pelunasan</span>
            <div>
              <div id="aktifNomorPelunasan" class="text-3xl font-black text-[#EED9B9]">--</div>
              <div id="aktifNamaPelunasan" class="text-xs opacity-80 truncate mt-1">Tidak ada</div>
            </div>
            <div class="space-y-2">
              <button onclick="panggilUlangKategori('pelunasan')" class="w-full py-1.5 bg-[#D53E0F] hover:bg-[#9B0F06] text-[#EED9B9] font-bold text-xs rounded-lg shadow">
                🔊 Panggil Suara
              </button>
              <button onclick="selesaikanAntrianKategori('pelunasan')" class="w-full py-1.5 bg-green-700 hover:bg-green-800 text-white font-bold text-xs rounded-lg shadow">
                Selesai
              </button>
            </div>
          </div>
        </div>

        <!-- Tombol Aksi Global -->
        <div class="glass-box p-5 rounded-2xl space-y-3">
          <button onclick="resetSetelanPabrik()" class="w-full py-3 bg-red-950/80 hover:bg-red-900 text-red-200 border border-red-700 font-bold rounded-xl text-xs uppercase tracking-wider transition-all">
            ⚠️ Reset Semua Antrian (Setelan Pabrik)
          </button>
        </div>

      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://oapbpywsvgzegrhfhghn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2e3hma5Eo6DXz6_i034kDQ_rQl9lOhK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeData = {
      unit: null,
      bpkb: null,
      pelunasan: null
    };

    async function loadData() {
      // 1. Ambil daftar antrian menunggu
      const { data: dataMenunggu } = await supabaseClient
        .from('reservasi')
        .select('*')
        .eq('status', 'menunggu')
        .order('id', { ascending: true });

      const container = document.getElementById('daftarAntrian');
      container.innerHTML = '';

      if (!dataMenunggu || dataMenunggu.length === 0) {
        container.innerHTML = '<p class="text-sm opacity-50">Tidak ada antrian menunggu.</p>';
      } else {
        dataMenunggu.forEach(item => {
          const div = document.createElement('div');
          div.className = 'flex items-center justify-between p-3 rounded-xl bg-[#5E0006] border border-[#D53E0F]/50';
          div.innerHTML = `
            <div>
              <span class="text-lg font-bold text-[#EED9B9]">${item.nomor_antrian}</span>
              <span class="text-xs ml-2 opacity-75">(${item.nama})</span>
              <div class="text-[10px] uppercase text-[#D53E0F] font-semibold">${item.kategori}</div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="panggilAntrian(${item.id}, '${item.kategori}')" 
                      class="px-3 py-2 bg-[#D53E0F] text-[#EED9B9] font-bold text-xs rounded-lg hover:bg-[#9B0F06]">
                Panggil
              </button>
              <button onclick="hapusSatuAntrian(${item.id}, '${item.nomor_antrian}')" 
                      class="px-3 py-2 bg-red-900/80 text-red-200 hover:bg-red-800 font-bold text-xs rounded-lg border border-red-600">
                Hapus
              </button>
            </div>
          `;
          container.appendChild(div);
        });
      }

      // 2. Ambil semua antrian yang sedang berstatus 'dipanggil'
      const { data: dataDipanggil } = await supabaseClient
        .from('reservasi')
        .select('*')
        .eq('status', 'dipanggil');

      activeData = { unit: null, bpkb: null, pelunasan: null };
      
      document.getElementById('aktifNomorUnit').innerText = '--';
      document.getElementById('aktifNamaUnit').innerText = 'Tidak ada';
      document.getElementById('aktifNomorBpkb').innerText = '--';
      document.getElementById('aktifNamaBpkb').innerText = 'Tidak ada';
      document.getElementById('aktifNomorPelunasan').innerText = '--';
      document.getElementById('aktifNamaPelunasan').innerText = 'Tidak ada';

      if (dataDipanggil && dataDipanggil.length > 0) {
        dataDipanggil.forEach(item => {
          if (item.kategori === 'unit') {
            activeData.unit = item;
            document.getElementById('aktifNomorUnit').innerText = item.nomor_antrian;
            document.getElementById('aktifNamaUnit').innerText = item.nama;
          } else if (item.kategori === 'bpkb') {
            activeData.bpkb = item;
            document.getElementById('aktifNomorBpkb').innerText = item.nomor_antrian;
            document.getElementById('aktifNamaBpkb').innerText = item.nama;
          } else if (item.kategori === 'pelunasan') {
            activeData.pelunasan = item;
            document.getElementById('aktifNomorPelunasan').innerText = item.nomor_antrian;
            document.getElementById('aktifNamaPelunasan').innerText = item.nama;
          }
        });
      }
    }

    async function panggilAntrian(id, kategori) {
      const loket = document.getElementById('selectLoket').value;

      const { error } = await supabaseClient
        .from('reservasi')
        .update({ status: 'dipanggil', loket: loket })
        .eq('id', id);

      if (!error) {
        loadData();
      }
    }

    async function panggilUlangKategori(kategori) {
      const item = activeData[kategori];
      if (!item) {
        alert(`Tidak ada antrian ${kategori} yang sedang aktif untuk dipanggil.`);
        return;
      }
      const loket = document.getElementById('selectLoket').value;

      // Update loket di database agar display mendeteksi trigger pemanggilan ulang
      await supabaseClient
        .from('reservasi')
        .update({ loket: loket })
        .eq('id', item.id);
        
      alert(`Memanggil ulang nomor ${item.nomor_antrian} untuk Loket ${loket}`);
    }

    async function selesaikanAntrianKategori(kategori) {
      const item = activeData[kategori];
      if (!item) {
        alert(`Tidak ada antrian ${kategori} yang sedang dipanggil.`);
        return;
      }

      const { error } = await supabaseClient
        .from('reservasi')
        .update({ status: 'selesai' })
        .eq('id', item.id);

      if (!error) {
        loadData();
      }
    }

    async function hapusSatuAntrian(id, nomor) {
      if (!confirm(`Hapus nomor antrian ${nomor}?`)) return;

      const { error } = await supabaseClient
        .from('reservasi')
        .delete()
        .eq('id', id);

      if (!error) {
        loadData();
      } else {
        alert('Gagal menghapus: ' + error.message);
      }
    }

    async function resetSetelanPabrik() {
      const konfirmasi = confirm("Apakah Anda yakin ingin menghapus SELURUH data antrian dan mengembalikannya ke setelan pabrik?");
      if (!konfirmasi) return;

      const { error } = await supabaseClient
        .from('reservasi')
        .delete()
        .neq('id', 0);

      if (error) {
        alert("Gagal melakukan reset: " + error.message);
      } else {
        alert("Berhasil! Semua data antrian telah dibersihkan.");
        loadData();
      }
    }

    supabaseClient.channel('admin-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reservasi' }, () => {
        loadData();
      })
      .subscribe();

    setInterval(loadData, 2000);
    loadData();
  </script>
</body>
</html>
