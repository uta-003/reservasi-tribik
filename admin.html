<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Balai Lelang Tribik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #5E0006; color: #EED9B9; }
    .glass-box { background: rgba(155, 15, 6, 0.3); backdrop-filter: blur(12px); border: 1px solid rgba(213, 62, 15, 0.3); }
  </style>
</head>
<body class="p-6 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header Admin -->
    <div class="flex justify-between items-center glass-box p-5 rounded-2xl">
      <div>
        <h1 class="text-2xl font-bold text-[#EED9B9]">Panel Kontrol Loket Admin</h1>
        <p class="text-xs opacity-75">Balai Lelang Tribik</p>
      </div>
      <div class="flex items-center gap-3">
        <label class="text-xs font-bold uppercase">Pilih Loket Anda:</label>
        <select id="selectLoket" class="bg-[#5E0006] text-[#EED9B9] border border-[#D53E0F] px-4 py-2 rounded-xl text-sm font-bold">
          <option value="1">Loket 1</option>
          <option value="2">Loket 2</option>
          <option value="3">Loket 3</option>
        </select>
      </div>
    </div>

    <!-- Layout Grid Admin -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Daftar Antrian Menunggu -->
      <div class="glass-box p-5 rounded-2xl space-y-4">
        <h2 class="font-bold text-lg text-[#EED9B9] border-b border-[#D53E0F] pb-2">Daftar Antrian Menunggu</h2>
        <div id="daftarAntrian" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
          <p class="text-sm opacity-50">Memuat data antrian...</p>
        </div>
      </div>

      <!-- Detail Antrian Dipanggil -->
      <div class="glass-box p-5 rounded-2xl flex flex-col justify-between space-y-6">
        <div>
          <h2 class="font-bold text-lg text-[#EED9B9] border-b border-[#D53E0F] pb-2">Sedang Dilayani Saat Ini</h2>
          <div id="aktifBox" class="text-center py-10 space-y-3">
            <div id="aktifNomor" class="text-6xl font-black text-[#D53E0F]">--</div>
            <div id="aktifNama" class="text-xl font-medium text-[#EED9B9]">Belum ada antrian dipanggil</div>
          </div>
        </div>

        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <button onclick="selesaikanAntrian()" class="py-3 bg-green-700 hover:bg-green-800 text-white font-bold rounded-xl shadow">
              Selesai
            </button>
            <button onclick="panggilUlang()" class="py-3 bg-[#D53E0F] hover:bg-[#9B0F06] text-[#EED9B9] font-bold rounded-xl shadow">
              Panggil Ulang Suara
            </button>
          </div>
          
          <!-- Tombol Reset Setelan Pabrik -->
          <button onclick="resetSetelanPabrik()" class="w-full py-3 bg-red-950/80 hover:bg-red-900 text-red-200 border border-red-700 font-bold rounded-xl text-xs uppercase tracking-wider transition-all">
            ⚠️ Reset Antrian (Setelan Pabrik)
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://oapbpywsvgzegrhfhghn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2e3hma5Eo6DXz6_i034kDQ_rQl9lOhK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentActiveId = null;

    async function loadData() {
      // 1. Ambil daftar antrian menunggu
      const { data: dataMenunggu } = await supabaseClient
        .from('reservasi')
        .select('*')
        .eq('status', 'menunggu')
        .order('id', { ascending: true });

      const container = document.getElementById('daftarAntrian');
      container.innerHTML = '';

      if (!dataMenunggu || dataMenunggu.length === 0) {
        container.innerHTML = '<p class="text-sm opacity-50">Tidak ada antrian menunggu.</p>';
      } else {
        dataMenunggu.forEach(item => {
          const div = document.createElement('div');
          div.className = 'flex items-center justify-between p-3 rounded-xl bg-[#5E0006] border border-[#D53E0F]/50';
          div.innerHTML = `
            <div>
              <span class="text-lg font-bold text-[#EED9B9]">${item.nomor_antrian}</span>
              <span class="text-xs ml-2 opacity-75">(${item.nama})</span>
              <div class="text-[10px] uppercase text-[#D53E0F] font-semibold">${item.kategori}</div>
            </div>
            <button onclick="panggilAntrian(${item.id}, '${item.nomor_antrian}', '${item.nama}')" 
                    class="px-4 py-2 bg-[#D53E0F] text-[#EED9B9] font-bold text-xs rounded-lg hover:bg-[#9B0F06]">
              Panggil
            </button>
          `;
          container.appendChild(div);
        });
      }

      // 2. Ambil antrian yang sedang dipanggil
      const { data: dataDipanggil } = await supabaseClient
        .from('reservasi')
        .select('*')
        .eq('status', 'dipanggil')
        .order('id', { ascending: false })
        .limit(1);

      if (dataDipanggil && dataDipanggil.length > 0) {
        currentActiveId = dataDipanggil[0].id;
        document.getElementById('aktifNomor').innerText = dataDipanggil[0].nomor_antrian;
        document.getElementById('aktifNama').innerText = dataDipanggil[0].nama;
      } else {
        currentActiveId = null;
        document.getElementById('aktifNomor').innerText = '--';
        document.getElementById('aktifNama').innerText = 'Tidak Ada Antrian Dipanggil';
      }
    }

    async function panggilAntrian(id, nomor, nama) {
      const loket = document.getElementById('selectLoket').value;

      const { error } = await supabaseClient
        .from('reservasi')
        .update({ status: 'dipanggil', loket: loket })
        .eq('id', id);

      if (!error) {
        loadData();
      }
    }

    async function selesaikanAntrian() {
      if (!currentActiveId) return;
      await supabaseClient.from('reservasi').update({ status: 'selesai' }).eq('id', currentActiveId);
      loadData();
    }

    async function panggilUlang() {
      if (!currentActiveId) return;
      const loket = document.getElementById('selectLoket').value;
      
      await supabaseClient
        .from('reservasi')
        .update({ loket: loket })
        .eq('id', currentActiveId);
    }

    async function resetSetelanPabrik() {
      const konfirmasi = confirm("Apakah Anda yakin ingin menghapus SELURUH data antrian dan mengembalikannya ke setelan pabrik?");
      if (!konfirmasi) return;

      const { error } = await supabaseClient
        .from('reservasi')
        .delete()
        .neq('id', 0);

      if (error) {
        alert("Gagal melakukan reset: " + error.message);
      } else {
        alert("Berhasil! Semua data antrian telah dibersihkan.");
        loadData();
      }
    }

    supabaseClient.channel('admin-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reservasi' }, () => {
        loadData();
      })
      .subscribe();

    setInterval(loadData, 2000);
    loadData();
  </script>
</body>
</html>
